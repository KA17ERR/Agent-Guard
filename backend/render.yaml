# Render Blueprint — optional. Lets you deploy by clicking "New Blueprint
# Instance" in Render and pointing it at this repo, instead of configuring
# the service by hand in the dashboard. Both paths are documented in
# DEPLOYMENT.md; use whichever you're more comfortable with.
#
# Secrets (OPENAI_API_KEY / GEMINI_API_KEY) are intentionally NOT set here
# — Render will prompt for them during Blueprint setup ("sync: false"
# means "ask me, don't store a value in this file").
services:
  - type: web
    name: agentguard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: agentguard-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your deployed Vercel URL after the frontend is deployed
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: agentguard-db
    plan: free
    databaseName: agentguard
    user: agentguard
